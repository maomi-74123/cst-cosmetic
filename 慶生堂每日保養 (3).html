<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>慶生堂每日保養</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
  /* Layout: entry home (logo + leaf, left button column, product card) → check-in → daily video. Committed warm-peach brand, single theme. */
  :root{
    color-scheme: light;
    --peach-top:#fdead9;
    --peach-bot:#f3d6b4;
    --surface:#ffffff;
    --ink:#4a3b32;
    --ink-soft:#8c7d70;
    --line:#ecdcc6;
    --gold:#b08a4a;
    --maroon:#96281e;
    --cal:#b0502f;  --cal-d:#8c3e23;
    --shop:#d79a2b; --shop-d:#b47d1d;
    --info:#2f4c8f; --info-d:#243c70;
    --shadow:0 6px 20px rgba(120,74,40,.14);
    --r:20px;
    --font:"Noto Sans TC", system-ui, "PingFang TC","Microsoft JhengHei", sans-serif;
    --serif:"Noto Serif TC", Georgia, "Songti TC", serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--font); color:var(--ink);
       font-size:19px; line-height:1.6; -webkit-text-size-adjust:100%;
       background:linear-gradient(180deg,var(--peach-top),var(--peach-bot) 85%);
       background-attachment:fixed; min-height:100%}
  .screen{display:none}
  .screen.active{display:block}
  .wrap{max-width:600px; margin:0 auto;
        padding-left:max(16px, env(safe-area-inset-left,0px));
        padding-right:max(16px, env(safe-area-inset-right,0px));
        padding-block:14px 26px}
  button{font-family:inherit; cursor:pointer}
  :focus-visible{outline:3px solid var(--gold); outline-offset:3px}

  /* ---------- HOME ---------- */
  .home-head{background:var(--surface); border-radius:0 0 26px 26px;
             box-shadow:var(--shadow); margin:-14px -16px 0;
             padding:16px max(20px, env(safe-area-inset-left,0px)) 16px;
             display:flex; align-items:center; justify-content:space-between; gap:12px}
  .home-head img.logo{height:52px; width:auto; display:block}
  .leaf{width:40px; height:40px; flex:none}

  .home-body{display:grid; grid-template-columns:42% 1fr; gap:16px; margin-top:22px;
             align-items:start}
  .col-btns{display:flex; flex-direction:column; gap:16px}

  .fbtn{border:none; color:#fff; border-radius:var(--r);
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:10px; text-align:center; font-family:var(--serif); font-weight:700;
        letter-spacing:.06em; line-height:1.3; padding:18px 10px;
        transition:transform .08s, box-shadow .08s}
  .fbtn .ico{width:50px; height:50px}
  .fbtn .lbl{font-size:1.25rem}
  .fbtn:active{transform:translateY(3px)}
  .fbtn.cal{background:var(--cal);  box-shadow:0 5px 0 var(--cal-d);  min-height:190px}
  .fbtn.cal:active{box-shadow:0 2px 0 var(--cal-d)}
  .fbtn.shop{background:var(--shop); box-shadow:0 5px 0 var(--shop-d)}
  .fbtn.shop:active{box-shadow:0 2px 0 var(--shop-d)}
  .fbtn.info{background:var(--info); box-shadow:0 5px 0 var(--info-d)}
  .fbtn.info:active{box-shadow:0 2px 0 var(--info-d)}
  .fbtn.row{flex-direction:row; gap:14px; min-height:96px}
  .fbtn.row .ico{width:42px; height:42px}

  .prod-card{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow);
             padding:20px 16px 22px; display:flex; flex-direction:column; align-items:center;
             gap:14px; align-self:stretch}
  .prod-card .bottle{width:100%; max-width:150px; height:auto}
  .prod-card .cap{font-family:var(--serif); font-weight:700; font-size:1.5rem;
                  color:var(--ink); text-align:center; line-height:1.35}
  .prod-card .name{color:var(--ink-soft); font-size:1rem; text-align:center}

  .year{text-align:center; color:var(--gold); font-family:var(--serif); font-weight:700;
        letter-spacing:.3em; margin-top:30px; font-size:1.1rem}

  /* ---------- inner header (back) ---------- */
  .top{display:flex; align-items:center; gap:12px; margin:-2px -4px 18px;
       justify-content:space-between}
  .back{display:inline-flex; align-items:center; gap:9px; background:var(--surface);
        border:1.5px solid var(--line); color:var(--cal); font-weight:700;
        font-size:1.15rem; padding:12px 20px 12px 16px; border-radius:999px;
        box-shadow:var(--shadow)}
  .back:active{transform:translateY(2px)}
  .back svg{width:22px; height:22px}
  .top .mini-logo{height:34px; width:auto; opacity:.95}

  /* ---------- CHECK-IN ---------- */
  .page-title{font-family:var(--serif); font-weight:900; color:var(--maroon);
              font-size:1.9rem; text-align:center; margin:4px 0 2px}
  .page-sub{text-align:center; color:var(--ink-soft); margin-bottom:20px; font-size:1.05rem}

  .panel{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow);
         padding:24px 20px; display:flex; flex-direction:column; gap:16px; align-items:center;
         text-align:center}
  .status-big{font-size:1.3rem; font-weight:700}
  .status-big.done{color:var(--cal-d)}
  .tick{width:72px; height:72px; border-radius:50%; background:#f6e6dc; color:var(--cal);
        display:flex; align-items:center; justify-content:center; font-size:2.4rem; font-weight:900}
  .big-btn{border:none; color:#fff; background:var(--cal); width:100%;
           font-size:1.55rem; font-weight:900; font-family:var(--serif); letter-spacing:.05em;
           padding:22px 12px; border-radius:18px; box-shadow:0 5px 0 var(--cal-d);
           min-height:76px; transition:transform .08s, box-shadow .08s}
  .big-btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--cal-d)}
  .big-btn:disabled{background:#e7d6c8; color:var(--cal-d); box-shadow:none}
  .big-btn.go{background:var(--shop); box-shadow:0 5px 0 var(--shop-d)}
  .big-btn.go:active{box-shadow:0 2px 0 var(--shop-d)}

  .stats{display:flex; gap:12px; margin-top:18px}
  .stat{flex:1; background:var(--surface); border-radius:16px; box-shadow:var(--shadow);
        padding:14px 6px; text-align:center}
  .stat .num{font-size:2rem; font-weight:900; color:var(--cal-d); font-variant-numeric:tabular-nums; line-height:1.1}
  .stat .lbl{font-size:.95rem; color:var(--ink-soft)}

  .card{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow);
        padding:20px 16px; margin-top:16px; display:flex; flex-direction:column; gap:14px}
  .card-head{display:flex; align-items:baseline; justify-content:space-between}
  .card-head h2{margin:0; font-family:var(--serif); font-size:1.3rem; color:var(--maroon)}
  .card-head .frac{color:var(--ink-soft); font-variant-numeric:tabular-nums}
  .grid{display:grid; grid-template-columns:repeat(6,1fr); gap:10px}
  @media (max-width:360px){.grid{grid-template-columns:repeat(5,1fr)}}
  .cell{aspect-ratio:1; border-radius:50%; background:#efe6da; color:var(--ink-soft);
        display:flex; align-items:center; justify-content:center; font-weight:700;
        font-variant-numeric:tabular-nums; border:2px solid transparent}
  .cell.filled{background:var(--cal); color:#fff; border-color:var(--cal-d)}
  .cell.filled::after{content:"✓"; font-size:1.2rem; font-weight:900}
  .cell.filled span{display:none}
  .cell.milestone.filled{background:var(--gold); border-color:#8c6c33}
  .cell.pop{animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

  .reward{border-radius:16px; padding:14px 16px; margin-top:16px; font-size:1.05rem;
          font-weight:600; display:flex; gap:12px; align-items:center; line-height:1.5}
  .reward.a{background:#f6e6dc; color:var(--cal-d); border:1px solid var(--cal)}
  .reward.b{background:var(--gold); color:#fff}
  .reward .ic{font-size:1.5rem}

  .foot-note{text-align:center; color:var(--ink-soft); font-size:.9rem; margin-top:20px; line-height:1.6}
  .reset{display:block; margin:14px auto 0; background:transparent; border:1.5px solid var(--line);
         color:var(--ink-soft); font-size:.95rem; padding:10px 18px; border-radius:999px}
  .reset.confirm{border-color:var(--maroon); color:var(--maroon)}

  /* ---------- VIDEO ---------- */
  .player{background:#1c1510; border-radius:var(--r); box-shadow:var(--shadow);
          overflow:hidden; position:relative; aspect-ratio:9/16; max-width:330px; margin:0 auto;
          width:100%}
  .player video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
                background:#1c1510; display:block}
  .cover{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:18px; cursor:pointer;
         background:linear-gradient(160deg,#fdead9,#f3d6b4)}
  .cover .play{width:92px; height:92px; border-radius:50%; background:var(--maroon);
               display:flex; align-items:center; justify-content:center;
               box-shadow:0 8px 24px rgba(150,40,30,.4)}
  .cover .play svg{width:40px; height:40px; margin-left:6px}
  .cover .ptxt{font-family:var(--serif); font-weight:700; color:var(--maroon); font-size:1.3rem}
  .cover.hide{display:none}
  .vfallback{text-align:center; margin-top:14px; font-size:1rem; color:var(--ink-soft)}
  .vfallback a{color:var(--cal); font-weight:700; text-decoration:none; border-bottom:2px solid var(--cal)}
  .vcaption{text-align:center; color:var(--ink); margin-top:16px; font-size:1.1rem; line-height:1.6}
  .vcaption strong{color:var(--maroon); font-family:var(--serif)}
</style>

  /* ---------- navigation ---------- */
  var screens={};
  ["home","checkin","video"].forEach(function(id){ screens[id]=document.getElementById(id); });
  function show(id){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle("active", k===id); });
    window.scrollTo(0,0);
    if(id!=="video") resetPlayer();
    if(id==="checkin") render();
  }
  document.getElementById("toCheckin").addEventListener("click", function(){ show("checkin"); });
  document.querySelectorAll("[data-home]").forEach(function(b){ b.addEventListener("click", function(){ show("home"); }); });
  document.getElementById("toShop").addEventListener("click", function(){ window.open(SHOP_URL,"_blank","noopener"); });
  document.getElementById("toInfo").addEventListener("click", function(){ window.open(INFO_URL,"_blank","noopener"); });

  /* ---------- YouTube player (click to load) ---------- */
  var player=document.getElementById("player"), cover=document.getElementById("cover");
  var vid=document.getElementById("vid");
  function playVid(){
    if(!vid.getAttribute("src")) vid.setAttribute("src", VIDEO_SRC);
    cover.classList.add("hide");
    var p=vid.play(); if(p&&p.catch) p.catch(function(){});
  }
  function resetPlayer(){
    try{ vid.pause(); vid.currentTime=0; }catch(e){}
    cover.classList.remove("hide");
  }
  cover.addEventListener("click", playVid);
  cover.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); playVid(); } });

  /* ---------- check-in logic ---------- */
  var TOTAL=30, MILES=[7,21,30], KEY="qst_checkin_v1";
  function load(){ try{var r=localStorage.getItem(KEY); var a=r?JSON.parse(r):[]; return Array.isArray(a)?a:[];}catch(e){return [];} }
  function save(a){ try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){} }
  function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function pretty(){ var d=new Date(); var w=["日","一","二","三","四","五","六"][d.getDay()];
    return d.getFullYear()+" 年 "+(d.getMonth()+1)+" 月 "+d.getDate()+" 日　星期"+w; }
  function diff(a,b){ var pa=a.split("-").map(Number),pb=b.split("-").map(Number);
    return Math.round((new Date(pb[0],pb[1]-1,pb[2])-new Date(pa[0],pa[1]-1,pa[2]))/86400000); }

  var dates=Array.from(new Set(load().filter(function(x){return typeof x==="string";}))).sort();

  function streak(){
    if(!dates.length) return 0;
    if(diff(dates[dates.length-1], todayStr())>1) return 0;
    var s=1;
    for(var i=dates.length-1;i>0;i--){ if(diff(dates[i-1],dates[i])===1) s++; else break; }
    return s;
  }
  function buildGrid(pop){
    var g=document.getElementById("grid"); g.innerHTML="";
    var done=dates.length;
    for(var i=1;i<=TOTAL;i++){
      var c=document.createElement("div"); c.className="cell"; c.setAttribute("role","listitem");
      if(MILES.indexOf(i)!==-1) c.classList.add("milestone");
      if(i<=done){ c.classList.add("filled"); c.setAttribute("aria-label","第 "+i+" 天 已完成");
        if(pop===i) c.classList.add("pop"); }
      else{ var s=document.createElement("span"); s.textContent=i; c.appendChild(s);
        c.setAttribute("aria-label","第 "+i+" 天 未完成"); }
      g.appendChild(c);
    }
  }
  function render(pop){
    document.getElementById("todayStr").textContent=pretty();
    var done=dates.length, didToday=dates.indexOf(todayStr())!==-1;
    document.getElementById("doneNum").textContent=done;
    document.getElementById("streakNum").textContent=streak();
    document.getElementById("leftNum").textContent=Math.max(0,TOTAL-done);
    document.getElementById("fracDone").textContent=Math.min(done,TOTAL);

    var btn=document.getElementById("checkBtn"), st=document.getElementById("statusArea");
    if(didToday){
      btn.className="big-btn go"; btn.textContent="前往今日影片 ▶"; btn.disabled=false;
      btn.onclick=function(){ show("video"); };
      st.innerHTML='<div class="tick">✓</div><div class="status-big done">今天簽到完成！</div>';
    }else{
      btn.className="big-btn"; btn.textContent="今天簽到"; btn.disabled=false;
      btn.onclick=doCheckin;
      st.innerHTML='<div class="status-big">今天還沒簽到，點下面的大按鈕 👇</div>';
    }

    var slot=document.getElementById("rewardSlot"); slot.innerHTML="";
    if(done>=TOTAL) slot.innerHTML='<div class="reward b"><span class="ic">🎉</span><span>30 天全部完成！保養習慣已養成，回收試用組可兌換正裝優惠。</span></div>';
    else if(done>=21) slot.innerHTML='<div class="reward a"><span class="ic">🌱</span><span>連續保養超過 21 天，習慣正在成形，再 '+(TOTAL-done)+' 天就完成！</span></div>';
    else if(done>=7) slot.innerHTML='<div class="reward a"><span class="ic">⭐</span><span>滿一週了，做得很好！繼續每天簽到吧。</span></div>';

    buildGrid(pop);
  }
  function doCheckin(){
    var t=todayStr();
    if(dates.indexOf(t)!==-1){ show("video"); return; }
    dates.push(t); dates.sort(); save(dates);
    render(dates.length);
    var st=document.getElementById("statusArea");
    st.innerHTML='<div class="tick">✓</div><div class="status-big done">簽到成功！正在前往今日影片…</div>';
    document.getElementById("checkBtn").disabled=true;
    setTimeout(function(){ show("video"); }, 1300);
  }

  /* reset: two-tap confirm (confirm() is unavailable in artifacts) */
  var rb=document.getElementById("resetBtn"), armed=false, timer=null;
  rb.addEventListener("click", function(){
    if(!armed){ armed=true; rb.textContent="確定清除全部紀錄？再按一次"; rb.classList.add("confirm");
      timer=setTimeout(function(){ armed=false; rb.textContent="重新開始"; rb.classList.remove("confirm"); },4000); return; }
    clearTimeout(timer); armed=false; dates=[]; try{localStorage.removeItem(KEY);}catch(e){}
    rb.textContent="重新開始"; rb.classList.remove("confirm"); render();
  });

  render();
})();
</script>

</body></html>
